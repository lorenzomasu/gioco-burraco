name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Obsolete pull-request runs are cancelled. A `main` run is never cancelled mid-flight, so a
# Pages deployment is not interrupted; a newer `main` push waits and supersedes queued runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The single canonical gate: Vitest, production build, Playwright E2E, diff check.
      - name: Verify
        run: npm run verify

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Only a green `main` verify publishes, and it publishes the `dist` it just verified.
      - name: Upload verified build as the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deployed-smoke:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke the deployed site
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run smoke:deployed

  # Creates the release tag for the version in package.json on this exact commit, only after the
  # verified build was deployed and smoked. Idempotent: an existing tag is left untouched.
  tag:
    needs: deployed-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create version tag if missing
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          # --exit-code: 0 = tag found, 2 = no matching ref, anything else = a real error.
          set +e
          refs="$(git ls-remote --exit-code --tags origin "refs/tags/${tag}" "refs/tags/${tag}^{}")"
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "Tag ${tag} already exists ($(echo "${refs}" | tail -n1 | cut -f1)); nothing to do."
            exit 0
          elif [ "${status}" -ne 2 ]; then
            echo "::error::git ls-remote failed with exit code ${status}; cannot tell whether ${tag} exists."
            exit "${status}"
          fi
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"
          echo "Created lightweight tag ${tag} on ${GITHUB_SHA}."
